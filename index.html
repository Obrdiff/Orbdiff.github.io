<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin { to { --angle: 360deg; } }
  @keyframes floatGlow { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-2%,3%) scale(1.06); } }
  @keyframes rise { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: translateY(0); } }
  @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes overlayIn { from { opacity:0; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); } to { opacity:1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); } }
  @keyframes overlayOut { from { opacity:1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); } to { opacity:0; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); } }
  @keyframes panelIn { from { opacity:0; transform: translateY(16px) scale(0.97); } to { opacity:1; transform: translateY(0) scale(1); } }
  @keyframes panelOut { from { opacity:1; transform: translateY(0) scale(1); } to { opacity:0; transform: translateY(10px) scale(0.98); } }
  @keyframes modalBodyIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
  @keyframes modalItemIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  @keyframes spinLoader { to { transform: rotate(360deg); } }

  :root {
    --bg: #0E0E0F;
    --bg-elevated: #17171A;
    --bg-popup: #1D1D21;
    --bg-hover: #232328;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.11);
    --accent: #2E7FFF;
    --accent-2: #6FB3FF;
    --accent-soft: rgba(46,127,255,0.14);
    --text: #C8C8CE;
    --text-dim: #6B6B72;
    --text-bright: #F1F0F5;
    --shadow: rgba(0,0,0,0.6);
    --overlay: rgba(6,6,8,0.72);
    color-scheme: dark;
  }

  [data-theme="light"] {
    --bg: #F5F4F7;
    --bg-elevated: #FFFFFF;
    --bg-popup: #FFFFFF;
    --bg-hover: #F0EDF7;
    --border: rgba(20,16,30,0.08);
    --border-strong: rgba(20,16,30,0.14);
    --accent: #1C64F2;
    --accent-2: #4C8DFF;
    --accent-soft: rgba(28,100,242,0.10);
    --text: #4B4A54;
    --text-dim: #918F9C;
    --text-bright: #17151F;
    --shadow: rgba(90,70,130,0.16);
    --overlay: rgba(230,226,240,0.65);
    color-scheme: light;
  }

  html { scroll-behavior: smooth; height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Poppins', sans-serif;
    color: var(--text);
    margin: 0;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  *, *::before, *::after {
    transition-property: background-color, border-color, color;
    transition-duration: 0.22s;
    transition-timing-function: ease-out;
  }
  html, body {
    transition: background-color 0.22s ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .reveal,
    .modal-item-in,
    .modal-overlay,
    .modal-overlay.closing,
    .modal-panel,
    .modal-panel.closing,
    .modal-body-enter {
      opacity: 1 !important;
      transform: none !important;
      backdrop-filter: blur(6px) !important;
      -webkit-backdrop-filter: blur(6px) !important;
    }
  }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  ::selection { background: var(--accent-soft); color: var(--text-bright); }

  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .glass {

function bytes(n) {

const GH_CACHE_TTL = 5 * 60 * 1000;
function cacheget(key) {
  try {
    const raw = sessionStorage.getItem('gh:' + key);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.t > GH_CACHE_TTL) return null;
    return parsed.v;
  } catch (e) { return null; }
}
function cacheset(key, value) {
  try { sessionStorage.setItem('gh:' + key, JSON.stringify({ t: Date.now(), v: value })); } catch (e) {}
}
function fetchgh(url, attempt) {
  attempt = attempt || 0;
  const cached = cacheget(url);
  if (cached !== null) return Promise.resolve(cached);
  return fetch(url, { headers: { Accept: 'application/vnd.github+json' } })
    .catch(() => {
      const err = new Error('network');
      err.kind = 'network';
      throw err;
    })
    .then((res) => {
      if (res.status === 404) {
        const err = new Error('notfound');
        err.kind = 'notfound';
        throw err;
      }
      if (res.status === 403 || res.status === 429) {
        const remaining = res.headers.get('x-ratelimit-remaining');
        if (remaining === '0' || res.status === 429) {
          if (attempt < 1) return new Promise((r) => setTimeout(r, 1200)).then(() => fetchgh(url, attempt + 1));
          const reset = res.headers.get('x-ratelimit-reset');
          const err = new Error('ratelimit');
          err.kind = 'ratelimit';
          err.resetAt = reset ? new Date(parseInt(reset, 10) * 1000) : null;
          throw err;
        }
      }
      if (!res.ok) {
        if (attempt < 1) return new Promise((r) => setTimeout(r, 800)).then(() => fetchgh(url, attempt + 1));
        const err = new Error('status ' + res.status);
        err.kind = 'error';
        throw err;
      }
      return res.json().then((data) => { cacheset(url, data); return data; });
    });
}
function errmsg(e) {
  if (e && e.kind === 'ratelimit') {
    if (e.resetAt) {
      const mins = Math.max(1, Math.ceil((e.resetAt.getTime() - Date.now()) / 60000));
      return 'GitHub API rate limit reached. Try again in ' + mins + ' min.';
    }
    return 'GitHub API rate limit reached. Try again in a few minutes.';
  }
  if (e && e.kind === 'notfound') return 'This repository has no content at this path.';
  if (e && e.kind === 'network') return 'Could not connect to GitHub. Check your connection.';
  return 'Could not fetch the repository content.';
}

function userepos() {
  const [state, setState] = useState({ status: 'loading', tools: [], totalStars: 0, langs: 0 });

  useEffect(() => {
    let cancelled = false;

    async function fetchpages() {
      let page = 1;
      let all = [];
      while (true) {
        const url = 'https://api.github.com/users/' + USER + '/repos?per_page=100&page=' + page + '&sort=pushed';
        const data = await fetchgh(url);
        if (!Array.isArray(data) || data.length === 0) break;
        all = all.concat(data);
        if (data.length < 100) break;
        page += 1;
      }
      return all;
    }

    async function fetchrelease(name) {
      try {
        return await fetchgh('https://api.github.com/repos/' + USER + '/' + name + '/releases/latest');
      } catch (e) {
        return null;
      }
    }

    fetchpages()
      .then(async (repos) => {
        if (cancelled) return;
        const base = repos
          .filter((r) => !r.fork && !EXCLUDED_REPOS.has(r.name.toLowerCase()))
          .map((r) => ({
            name: r.name,
            desc: (r.description || 'No description provided yet.').trim(),
            stars: r.stargazers_count || 0,
            forks: r.forks_count || 0,
            lang: r.language || '—',
            url: r.html_url,
            pushedAt: r.pushed_at || null,
          }));

        const releases = await Promise.all(base.map((t) => fetchrelease(t.name)));
        if (cancelled) return;

        const tools = base
          .map((t, i) => ({ ...t, releaseAt: releases[i] && releases[i].published_at, latestRelease: releases[i] || null }))
          .sort((a, b) => {
            if (a.releaseAt && !b.releaseAt) return -1;
            if (!a.releaseAt && b.releaseAt) return 1;
            if (a.releaseAt && b.releaseAt) {
              const diff = new Date(b.releaseAt) - new Date(a.releaseAt);
              if (diff !== 0) return diff;
            } else {
              const diff = new Date(b.pushedAt || 0) - new Date(a.pushedAt || 0);
              if (diff !== 0) return diff;
            }
            return a.name.localeCompare(b.name);
          });

        const totalStars = repos
          .filter((r) => !r.fork)
          .reduce((a, r) => a + (r.stargazers_count || 0), 0);
        const langs = new Set(tools.map((t) => t.lang).filter((l) => l !== '—')).size;
        setState({ status: 'ready', tools, totalStars, langs });
      })
      .catch(() => { if (!cancelled) setState((s) => ({ ...s, status: 'error' })); });

    return () => { cancelled = true; };
  }, []);

  return state;
}

    h('div', { key: 2, className: 'border-t border-[var(--border)] py-5 flex items-center justify-center gap-1.5 text-[12px] font-mono', style: { color: 'var(--text-dim)' } }, [
      'OrbDiff · ',
      h('a', { key: 1, href: 'https://discord.gg/cfnmHrqP3K', target: '_blank', rel: 'noreferrer', className: 'transition-colors duration-[380ms] ease-[cubic-bezier(0.16,1,0.3,1)] hover:text-[var(--text-bright)]', style: { color: 'var(--accent-2)' } }, 'discord.gg/cfnmHrqP3K'),
    ]),
  ]);
}

function app() {
  const [theme, setTheme] = useState(() => {
    try {
      const saved = localStorage.getItem('orbdiff-theme');
      if (saved) return saved;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    } catch (e) { return 'dark'; }
  });
  const [activeTool, setActiveTool] = useState(null);
  const [closing, setClosing] = useState(false);
  const closeTimeoutRef = useRef(null);
  const { tools, totalStars, langs, status } = userepos();

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('orbdiff-theme', theme); } catch (e) {}
  }, [theme]);

  useEffect(() => () => { if (closeTimeoutRef.current) clearTimeout(closeTimeoutRef.current); }, []);

  useEffect(() => {
    function onenter(e) {
      const el = e.target.closest && e.target.closest('.shine');
      if (!el || el.classList.contains('shine-active')) return;
      el.classList.add('shine-active');
    }
    function onanimend(e) {
      if (e.animationName === 'shineSweep') {
        e.target.classList.remove('shine-active');
      }
    }
    document.addEventListener('mouseenter', onenter, true);
    document.addEventListener('animationend', onanimend, true);
    return () => {
      document.removeEventListener('mouseenter', onenter, true);
      document.removeEventListener('animationend', onanimend, true);
    };
  }, []);

  const toggleTheme = useCallback(() => setTheme((t) => (t === 'dark' ? 'light' : 'dark')), []);

  const openModal = useCallback((tool) => {
    if (closeTimeoutRef.current) clearTimeout(closeTimeoutRef.current);
    setClosing(false);
    setActiveTool(tool);
  }, []);

  const closeModal = useCallback(() => {
    setClosing(true);
    closeTimeoutRef.current = setTimeout(() => { setActiveTool(null); setClosing(false); }, 260);
  }, []);

  return h('div', { className: 'min-h-screen antialiased relative', style: { background: 'var(--bg)' } }, [
    h(particles, { key: 'particles' }),
    h('div', { key: 'content', className: 'relative', style: { zIndex: 1 } }, [
      h(nav, { key: 1, theme, onToggleTheme: toggleTheme }),
      h(stats, { key: 3, toolsCount: tools.length, totalStars, langs, status }),
      h(hero, { key: 2, totalStars, status }),
      h(method, { key: 4 }),
      h(toolsgrid, { key: 5, tools, status, onOpen: openModal }),
      h(footer, { key: 6 }),
      activeTool ? h(modal, { key: 'modal', tool: activeTool, closing, onClose: closeModal }) : null,
    ]),
  ]);
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(h(app));
} catch (e) {
  document.getElementById('root').innerHTML =
    '<div id="fallback">Failed to load: ' + e.message + '<br/>Check the console (F12) for more detail.</div>';
  console.error(e);
}
</script>
</body>
</html>
